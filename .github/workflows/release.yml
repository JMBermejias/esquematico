name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean Esquematico.spec

      - name: Create portable zip
        shell: pwsh
        run: |
          $distDir = "dist"
          $portableName = "Esquematico-portable"
          $portableDir = Join-Path $distDir $portableName
          if (Test-Path $portableDir) { Remove-Item -Recurse -Force $portableDir }
          Copy-Item -Recurse -Force (Join-Path $distDir "Esquematico") $portableDir
          Copy-Item -Force "esquematico\resources\icon.png" $portableDir
          Copy-Item -Force "README.md" $portableDir
          $start = @"
          Esquematico portable
          ====================
          1. Ejecute Esquematico.exe
          2. Elija un simbolo (biblioteca izquierda)
          3. Coloquelo en el lienzo
          4. Cable para conectar
          No requiere instalacion.
          "@
          Set-Content -Path (Join-Path $portableDir "LEEME.txt") -Value $start -Encoding UTF8
          Compress-Archive -Path "$portableDir\*" -DestinationPath (Join-Path $distDir "$portableName.zip")

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Host "::error::Inno Setup ISCC no encontrado"
            exit 1
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DDistDir=$PWD\dist" "scripts\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: List artifacts
        run: |
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Esquematico-portable.zip
            dist/Instalador-Esquematico-*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev fakeroot binutils \
            libgl1 libegl1 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon0 libxcb1 libxcb-xfixes0 libxcb-shm0 \
            libxcb-sync1 libdbus-1-3 libx11-xcb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build .deb package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: List artifacts
        run: |
          ls -lh dist/*.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*.deb

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/windows-artifacts/*
            artifacts/linux-artifacts/*
